[program:graalpy]
command=/usr/bin/bash /Users/chaneychan/IdeaProjects/graalPy/conf/start.sh
process_name=%(program_name)s ; process_name expr (default %(program_name)s)
numprocs=1                    ; number of processes copies to start (def 1)
directory=/Users/chaneychan/IdeaProjects/graalPy/conf                ; directory to cwd to before exec (def no cwd)
autostart=true                ; start at supervisord start (default: true)
autorestart=true              ; retstart at unexpected quit (default: true)
startsecs=2                  ; number of secs prog must stay running (def. 1)
startretries=3                ; max # of serial start failures (default 3):
user=chaneychan                   ; setuid to this UNIX account to run the program
redirect_stderr=true          ; redirect proc stderr to stdout (default false)
stdout_logfile=/home/chaneychan/dist/log/a.log        ; stdout log path, NONE for none; default AUTO
stderr_logfile=/home/chaneychan/dist/log/a.err.log        ; stderr log path, NONE for none; default AUTO
stopasgroup=true
killasgroup=true